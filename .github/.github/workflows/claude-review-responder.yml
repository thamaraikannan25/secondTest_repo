name: Send PR comments to Claude Routine

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  notify-claude:
    runs-on: ubuntu-latest
    if: github.event.issue.pull_request != null || github.event_name == 'pull_request_review_comment'
    steps:
      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Fire Claude routine
        env:
          COMMENT_BODY: ${{ github.event.comment.body || github.event.review.body }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          ROUTINE_FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
        run: |
          PAYLOAD=$(jq -n \
            --arg pr "$PR_NUMBER" \
            --arg repo "$REPO" \
            --arg comment "$COMMENT_BODY" \
            '{text: ("PR #" + $pr + " in repo " + $repo + " has a new comment: " + $comment + ". Read the PR diff, apply the fix, commit to the PR branch.")}')

          curl -X POST "https://api.anthropic.com/v1/claude_code/routines/trig_018DXcjFEWRtsX5izjPZ34Aj/fire" \
            -H "Authorization: Bearer $ROUTINE_FIRE_TOKEN" \
            -H "anthropic-version: 2023-06-01" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
