name: Claude Issue Implementation

on:
  issues:
    types: [labeled]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event.label.name == 'claude-ready'
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout main branch
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        id: configure-git
        run: |
          git config user.name "claude-bot"
          git config user.email "claude-bot@users.noreply.github.com"

      - name: Check Issue Eligibility
        id: eligibility
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const issueNumber = context.issue.number;
            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
            const comment = async (body) => github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body });

            if (issue.pull_request) {
              await comment(`## ❌ Claude: Not Starting\n- This is a Pull Request, not an Issue\n> No changes made.`);
              return core.setOutput('eligible', 'false');
            }
            if (issue.state === 'closed') {
              await comment(`## ❌ Claude: Not Starting\n- Issue is closed\n> No changes made.`);
              return core.setOutput('eligible', 'false');
            }
            const { data: prs } = await github.rest.pulls.list({ owner, repo, state: 'open' });
            const existing = prs.find(pr => pr.body && (
              pr.body.includes(`#${issueNumber}`) ||
              pr.body.includes(`Fixes #${issueNumber}`) ||
              pr.body.includes(`Closes #${issueNumber}`)
            ));
            if (existing) {
              await comment(`## ⚠️ Claude: Not Starting — Duplicate PR\nActive PR exists: ${existing.html_url}\n> No changes made.`);
              return core.setOutput('eligible', 'false');
            }
            if (!issue.body || issue.body.trim().length < 10) {
              await comment(`## ❓ Claude: Clarification Needed\n- Description missing or too short\n- Please provide: objective, scope, acceptance criteria\n> No changes made.`);
              return core.setOutput('eligible', 'false');
            }

            // Skip if already worked — has claude-done label
            const alreadyDone = issue.labels.some(l => l.name === 'claude-done');
            if (alreadyDone) {
              await comment(`## ⏭️ Claude: Skipping — Already Implemented\nThis issue already has the \`claude-done\` label.\nRemove it if you want Claude to re-implement.\n> No changes made.`);
              return core.setOutput('eligible', 'false');
            }

            // ✅ Issue picked up and eligible
            await comment(`## 🤖 Claude: Issue Picked Up\nIssue **#${issueNumber}** is eligible. Starting implementation now...`);
            core.setOutput('eligible', 'true');

      - name: Create Feature Branch
        id: branch
        if: steps.eligibility.outputs.eligible == 'true'
        run: |
          ISSUE_NUMBER=${{ github.event.issue.number }}
          CLEAN_TITLE=$(echo "${{ github.event.issue.title }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | cut -c1-40)
          BRANCH_NAME="claude-issue-${ISSUE_NUMBER}-${CLEAN_TITLE}"
          git push origin --delete "$BRANCH_NAME" 2>/dev/null || true
          git checkout -b "$BRANCH_NAME"
          git push origin "$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Get Existing Files List
        id: existing-files
        if: steps.eligibility.outputs.eligible == 'true'
        run: git ls-tree -r main --name-only > /tmp/existing_files.txt

      - name: Claude Implement Code
        id: claude
        if: steps.eligibility.outputs.eligible == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --model claude-sonnet-4-6
            --allowedTools "Edit,Write,Read,Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(cat:*),Bash(ls:*),Bash(find:*),Bash(grep:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr edit:*),Bash(gh pr comment:*),Bash(gh label create:*),Bash(gh label list:*),Bash(npm ci:*),Bash(npm install:*),Bash(npm run build:*),Bash(npm test:*),Bash(npm run test:*),Bash(npm run lint:*),Bash(pip install:*),Bash(pip3 install:*),Bash(python -m pytest:*),Bash(python3 -m pytest:*),Bash(python -c:*),Bash(python3 -c:*)"
          prompt: |
            You are a fully autonomous developer on issue #${{ github.event.issue.number }}.
            Branch: ${{ steps.branch.outputs.branch_name }} (already created — do NOT create another).

            REPO: React UI (npm) + Python Flask API (pip/pytest). Validate BOTH after implementing.

            ## BLOCKER RULE:
            If blocked → post issue comment with exact error → write BLOCKED=true to /tmp/pr_summary.txt → STOP.
            gh issue comment ${{ github.event.issue.number }} --body "## 🚫 Blocked\n**At:** [step]\n**Error:** [exact]\n**Needed:** [action]"

            ## STEP 1 — READ ISSUE:
            gh issue view ${{ github.event.issue.number }}
            If unclear → post clarification comment → STOP.

            ## STEP 2 — UNDERSTAND CODEBASE:
            Read /tmp/existing_files.txt, relevant files, package.json, requirements.txt, existing tests.

            ## STEP 3 — IMPLEMENT:
            - NEVER modify /tmp/existing_files.txt files unless required
            - Keep diff small — only this issue, no unrelated changes
            - Write tests for all new/modified behavior
            - Match existing code style exactly

            ## STEP 4 — VALIDATE REACT UI:
            npm ci 2>&1 | tee /tmp/npm_install.txt || npm install 2>&1 | tee /tmp/npm_install.txt
            npm run build 2>&1 | tee /tmp/build_output.txt
            npm test -- --watchAll=false --coverage --coverageReporters=text 2>&1 | tee /tmp/test_output.txt
            If build/tests fail → attempt fix → re-run → record result regardless.
            Write /tmp/ui_validation.txt:
            UI_BUILD_STATUS=[pass/fail/error]
            UI_BUILD_SUMMARY=[last 10 lines of build output]
            UI_TEST_STATUS=[pass/fail/not_configured]
            UI_TEST_COUNTS=[X passed Y failed]
            UI_COVERAGE_STATEMENTS=[X%]
            UI_COVERAGE_BRANCHES=[X%]
            UI_COVERAGE_FUNCTIONS=[X%]
            UI_COVERAGE_LINES=[X%]

            ## STEP 5 — VALIDATE FLASK API:
            pip install -r requirements.txt 2>&1 | tee /tmp/pip_output.txt
            python -m pytest --tb=short -v 2>&1 | tee /tmp/pytest_output.txt
            python -m pytest --cov=. --cov-report=term-missing --tb=short 2>&1 | tee /tmp/coverage_output.txt
            python -c "from app import app; app.config['TESTING']=True; app.test_client(); print('✅ Flask OK')" 2>&1 | tee /tmp/flask_smoke.txt
            If tests fail → attempt fix → re-run → record result regardless.
            Write /tmp/api_validation.txt:
            API_PYTEST_STATUS=[pass/fail/not_configured]
            API_PYTEST_COUNTS=[X passed Y failed]
            API_COVERAGE_TOTAL=[X% or N/A]
            API_FLASK_SMOKE=[pass/fail]
            API_FLASK_SMOKE_OUTPUT=[one line]

            ## STEP 6 — COMMIT AND PUSH:
            git add . && git commit -m "feat: implement issue #${{ github.event.issue.number }} — ${{ github.event.issue.title }}" && git push origin ${{ steps.branch.outputs.branch_name }}

            ## STEP 7 — CREATE PR:
            Read /tmp/ui_validation.txt and /tmp/api_validation.txt then create PR:
            gh pr create \
              --title "[Claude - Issue #${{ github.event.issue.number }}] ${{ github.event.issue.title }}" \
              --base main \
              --head ${{ steps.branch.outputs.branch_name }} \
              --label "claude-review" \
              --body "## 🤖 Claude Implementation
            Fixes #${{ github.event.issue.number }}
            ## Summary
            [what was implemented]
            ## Changes Made
            **Files Created:** [list] | **Files Modified:** [list] | **Tests Written:** [list]
            ## Validation Result
            ### 🖥️ React UI
            Build: [✅/❌] [UI_BUILD_STATUS] — [UI_BUILD_SUMMARY]
            Tests: [✅/❌] [UI_TEST_STATUS] — [UI_TEST_COUNTS]
            Coverage: Statements [UI_COVERAGE_STATEMENTS] | Branches [UI_COVERAGE_BRANCHES] | Functions [UI_COVERAGE_FUNCTIONS] | Lines [UI_COVERAGE_LINES]
            ### 🐍 Flask API
            pytest: [✅/❌] [API_PYTEST_STATUS] — [API_PYTEST_COUNTS]
            Coverage: [API_COVERAGE_TOTAL]
            Smoke: [✅/❌] [API_FLASK_SMOKE_OUTPUT]
            ## Known Limitations
            [or none]
            ## Risks
            [or none]"

            ## STEP 8 — VERIFY claude-review LABEL:
            gh pr view --json labels | grep -q claude-review || gh pr edit --add-label "claude-review"

            ## STEP 9 — ATTACH EVIDENCE TO PR:
            gh pr comment --body "## 🔍 Claude: Validation Evidence
            ### 🖥️ React UI
            **Build** [✅/❌ UI_BUILD_STATUS]:
            \`\`\`
            [FULL /tmp/build_output.txt — do not truncate]
            \`\`\`
            **Tests** [✅/❌ UI_TEST_STATUS] — [UI_TEST_COUNTS]:
            \`\`\`
            [FULL /tmp/test_output.txt — do not truncate]
            \`\`\`
            **Coverage:** Statements [UI_COVERAGE_STATEMENTS] | Branches [UI_COVERAGE_BRANCHES] | Functions [UI_COVERAGE_FUNCTIONS] | Lines [UI_COVERAGE_LINES]
            ---
            ### 🐍 Flask API
            **pytest** [✅/❌ API_PYTEST_STATUS] — [API_PYTEST_COUNTS]:
            \`\`\`
            [FULL /tmp/pytest_output.txt — do not truncate]
            \`\`\`
            **Coverage:**
            \`\`\`
            [FULL /tmp/coverage_output.txt — do not truncate]
            \`\`\`
            **Smoke Test** [✅/❌ API_FLASK_SMOKE]:
            \`\`\`
            [/tmp/flask_smoke.txt content]
            \`\`\`
            > 🤖 Evidence attached by Claude bot"

            ## STEP 10 — WRITE /tmp/pr_summary.txt:
            BLOCKED=false
            IMPLEMENTATION_SUMMARY=[paragraph]
            FILES_CREATED=[list] FILES_MODIFIED=[list] TESTS_WRITTEN=[list]
            UI_BUILD_STATUS=[pass/fail/error] UI_BUILD_OUTPUT=[one line]
            UI_TEST_STATUS=[pass/fail/not_configured] UI_TEST_OUTPUT=[one line with counts]
            UI_COVERAGE_STATEMENTS=[X%] UI_COVERAGE_BRANCHES=[X%] UI_COVERAGE_FUNCTIONS=[X%] UI_COVERAGE_LINES=[X%]
            API_PYTEST_STATUS=[pass/fail/not_configured] API_PYTEST_OUTPUT=[one line with counts]
            API_COVERAGE_TOTAL=[X% or N/A] API_FLASK_SMOKE=[pass/fail/not_run]
            PR_URL=[full url] KNOWN_LIMITATIONS=[or none] RISKS=[or none]

            SAFETY: Never force push, auto-merge, auto-close, delete branches, add labels, or move project status.

      - name: Fallback PR Creation
        id: create-pr
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list --head ${{ steps.branch.outputs.branch_name }} --json url --jq '.[0].url' 2>/dev/null || echo "")
          if [ -n "$EXISTING_PR" ]; then
            echo "pr_url=$EXISTING_PR" >> $GITHUB_OUTPUT
            echo "pr_number=${EXISTING_PR##*/}" >> $GITHUB_OUTPUT
          else
            IMPL=$(grep '^IMPLEMENTATION_SUMMARY=' /tmp/pr_summary.txt 2>/dev/null | cut -d= -f2- || echo "Implemented by Claude AI")
            UB=$(grep '^UI_BUILD_STATUS=' /tmp/pr_summary.txt 2>/dev/null | cut -d= -f2- || echo "not_run")
            UT=$(grep '^UI_TEST_STATUS=' /tmp/pr_summary.txt 2>/dev/null | cut -d= -f2- || echo "not_run")
            UT_OUT=$(grep '^UI_TEST_OUTPUT=' /tmp/pr_summary.txt 2>/dev/null | cut -d= -f2- || echo "N/A")
            UC_S=$(grep '^UI_COVERAGE_STATEMENTS=' /tmp/pr_summary.txt 2>/dev/null | cut -d= -f2- || echo "N/A")
            UC_B=$(grep '^UI_COVERAGE_BRANCHES=' /tmp/pr_summary.txt 2>/dev/null | cut -d= -f2- || echo "N/A")
            UC_F=$(grep '^UI_COVERAGE_FUNCTIONS=' /tmp/pr_summary.txt 2>/dev/null | cut -d= -f2- || echo "N/A")
            UC_L=$(grep '^UI_COVERAGE_LINES=' /tmp/pr_summary.txt 2>/dev/null | cut -d= -f2- || echo "N/A")
            AT=$(grep '^API_PYTEST_STATUS=' /tmp/pr_summary.txt 2>/dev/null | cut -d= -f2- || echo "not_run")
            AT_OUT=$(grep '^API_PYTEST_OUTPUT=' /tmp/pr_summary.txt 2>/dev/null | cut -d= -f2- || echo "N/A")
            AC=$(grep '^API_COVERAGE_TOTAL=' /tmp/pr_summary.txt 2>/dev/null | cut -d= -f2- || echo "N/A")
            AS=$(grep '^API_FLASK_SMOKE=' /tmp/pr_summary.txt 2>/dev/null | cut -d= -f2- || echo "not_run")
            UBE=$([ "$UB" = "pass" ] && echo "✅" || echo "❌")
            UTE=$([ "$UT" = "pass" ] && echo "✅" || echo "❌")
            ATE=$([ "$AT" = "pass" ] && echo "✅" || echo "❌")
            ASE=$([ "$AS" = "pass" ] && echo "✅" || echo "❌")
            PR_URL=$(gh pr create \
              --title "[Claude - Issue #${{ github.event.issue.number }}] ${{ github.event.issue.title }}" \
              --base main --head ${{ steps.branch.outputs.branch_name }} --label "claude-review" \
              --body "## 🤖 Claude Implementation
            Fixes #${{ github.event.issue.number }}
            ## Summary
            ${IMPL}
            ## Validation Result
            ### 🖥️ React UI
            Build: ${UBE} ${UB} | Tests: ${UTE} ${UT} — ${UT_OUT}
            Coverage: Statements ${UC_S} | Branches ${UC_B} | Functions ${UC_F} | Lines ${UC_L}
            ### 🐍 Flask API
            pytest: ${ATE} ${AT} — ${AT_OUT} | Coverage: ${AC} | Smoke: ${ASE} ${AS}")
            echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
            echo "pr_number=${PR_URL##*/}" >> $GITHUB_OUTPUT
          fi

      - name: Attach Validation Evidence to PR
        id: attach-evidence
        if: steps.eligibility.outputs.eligible == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const prNumber = '${{ steps.create-pr.outputs.pr_number }}';
            const owner = context.repo.owner, repo = context.repo.repo;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: parseInt(prNumber) });
            if (comments.some(c => c.body?.includes('Claude: Validation Evidence'))) return;
            const read = (f) => { try { return fs.readFileSync(f, 'utf8').slice(-3000); } catch(e) { return 'N/A'; } };
            const get = (k) => { try { return fs.readFileSync('/tmp/pr_summary.txt','utf8').split('\n').find(l=>l.startsWith(k+'='))?.split('=').slice(1).join('=')||'N/A'; } catch(e) { return 'N/A'; } };
            const e = s => s==='pass'?'✅':s==='not_run'||s==='N/A'?'⏭️':'❌';
            const uiBuild=get('UI_BUILD_STATUS'), uiTest=get('UI_TEST_STATUS'), uiTestOut=get('UI_TEST_OUTPUT');
            const uiCS=get('UI_COVERAGE_STATEMENTS'), uiCB=get('UI_COVERAGE_BRANCHES'), uiCF=get('UI_COVERAGE_FUNCTIONS'), uiCL=get('UI_COVERAGE_LINES');
            const apiTest=get('API_PYTEST_STATUS'), apiTestOut=get('API_PYTEST_OUTPUT'), apiCov=get('API_COVERAGE_TOTAL'), apiSmoke=get('API_FLASK_SMOKE');
            await github.rest.issues.createComment({ owner, repo, issue_number: parseInt(prNumber), body:
              `## 🔍 Claude: Validation Evidence\n\n---\n\n` +
              `## 🖥️ React UI\n\n` +
              `**Build** ${e(uiBuild)} **${uiBuild}**\n\`\`\`\n${read('/tmp/build_output.txt')}\n\`\`\`\n\n` +
              `**Tests** ${e(uiTest)} **${uiTest}** — ${uiTestOut}\n\`\`\`\n${read('/tmp/test_output.txt')}\n\`\`\`\n\n` +
              `**Coverage:** Statements ${uiCS} | Branches ${uiCB} | Functions ${uiCF} | Lines ${uiCL}\n\n---\n\n` +
              `## 🐍 Flask API\n\n` +
              `**pytest** ${e(apiTest)} **${apiTest}** — ${apiTestOut}\n\`\`\`\n${read('/tmp/pytest_output.txt')}\n\`\`\`\n\n` +
              `**Coverage:**\n\`\`\`\n${read('/tmp/coverage_output.txt')}\n\`\`\`\n\n` +
              `**Smoke Test** ${e(apiSmoke)} **${apiSmoke}**\n\`\`\`\n${read('/tmp/flask_smoke.txt')}\n\`\`\`\n\n` +
              `> ⚠️ Evidence posted by workflow fallback`
            });

      # ✅ Add claude-done label + post success comment
      - name: Post Success Comment
        id: post-success
        if: steps.eligibility.outputs.eligible == 'true' && success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const issueNumber = context.issue.number;

            // Add claude-done label (create if missing)
            try { await github.rest.issues.getLabel({ owner, repo, name: 'claude-done' }); }
            catch { await github.rest.issues.createLabel({ owner, repo, name: 'claude-done', color: '0e8a16', description: 'Issue implemented by Claude' }); }
            await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: ['claude-done'] });

            // Remove claude-ready so it won't re-trigger
            try { await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: 'claude-ready' }); } catch(e) {}

            await github.rest.issues.createComment({
              owner, repo, issue_number: issueNumber,
              body: `## ✅ Claude: Implementation Successful\nPR created and ready for review.\n\n**PR:** ${{ steps.create-pr.outputs.pr_url }}\n**Branch:** \`${{ steps.branch.outputs.branch_name }}\`\n\n> \`claude-done\` label added — issue won\'t be re-processed.\n\n👨‍💻 Please review and approve to merge.`
            });

      - name: Trigger Claude Review Workflow
        id: trigger-review
        if: steps.eligibility.outputs.eligible == 'true' && success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'claude-review.yml',
              ref: 'main',
              inputs: {
                pr_number: '${{ steps.create-pr.outputs.pr_number }}'
              }
            });
            console.log('✅ claude-review workflow triggered for PR #${{ steps.create-pr.outputs.pr_number }}');

      # ❌ Issue implementation failed
      - name: Post Failure Comment
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const outcomes = {
              'Checkout':           '${{ steps.checkout.outcome }}',
              'Configure Git':      '${{ steps.configure-git.outcome }}',
              'Eligibility Check':  '${{ steps.eligibility.outcome }}',
              'Create Branch':      '${{ steps.branch.outcome }}',
              'Get Existing Files': '${{ steps.existing-files.outcome }}',
              'Claude Implement':   '${{ steps.claude.outcome }}',
              'Fallback PR':        '${{ steps.create-pr.outcome }}',
              'Attach Evidence':    '${{ steps.attach-evidence.outcome }}',
            };
            const failed = Object.entries(outcomes).filter(([,v])=>v==='failure').map(([k])=>`❌ ${k}`);
            let blocker = '';
            try { if (fs.readFileSync('/tmp/pr_summary.txt','utf8').includes('BLOCKED=true')) blocker = '\n> ⚠️ Claude reported a blocker — check comments above for details.'; } catch(e) {}
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ❌ Claude: Implementation Failed${blocker}\n\nFailed at: ${failed.join(', ')||'unknown step'}\n\n🔍 [View Actions log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\nRemove \`claude-ready\` label and re-add to retry.`
            });
