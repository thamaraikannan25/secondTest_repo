name: Claude Issue Implementation

on:
  issues:
    types: [labeled]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CLAUDE_BASE_BRANCH: ${{ vars.CLAUDE_BASE_BRANCH || 'onboarding' }}

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event.label.name == 'claude-ready'
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout integration branch
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ env.CLAUDE_BASE_BRANCH }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        id: configure-git
        run: |
          git config user.name "claude-bot"
          git config user.email "claude-bot@users.noreply.github.com"

      - name: Check Issue Eligibility
        id: eligibility
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const issueNumber = context.issue.number;
            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
            const comment = async (body) => github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body });

            if (issue.pull_request) {
              await comment(`## ❌ Claude: Not Starting\n- This is a Pull Request, not an Issue\n> No changes made.`);
              return core.setOutput('eligible', 'false');
            }
            if (issue.state === 'closed') {
              await comment(`## ❌ Claude: Not Starting\n- Issue is closed\n> No changes made.`);
              return core.setOutput('eligible', 'false');
            }
            const { data: search } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:pr is:open "${issueNumber}" in:body`,
            });
            const existing = search.items.find((pr) =>
              pr.body &&
              (pr.body.includes(`Fixes #${issueNumber}`) ||
                pr.body.includes(`Closes #${issueNumber}`) ||
                pr.body.includes(`#${issueNumber}`))
            );
            if (existing) {
              await comment(`## ⚠️ Claude: Not Starting — Duplicate PR\nActive PR exists: ${existing.html_url}\n> No changes made.`);
              return core.setOutput('eligible', 'false');
            }
            if (!issue.body || issue.body.trim().length < 10) {
              await comment(`## ❓ Claude: Clarification Needed\n- Description missing or too short\n- Please provide: objective, scope, acceptance criteria\n> No changes made.`);
              return core.setOutput('eligible', 'false');
            }
            const alreadyDone = issue.labels.some(l => l.name === 'claude-done');
            if (alreadyDone) {
              await comment(`## ⏭️ Claude: Skipping — Already Implemented\nThis issue already has the \`claude-done\` label.\nRemove it if you want Claude to re-implement.\n> No changes made.`);
              return core.setOutput('eligible', 'false');
            }
            await comment(`## 🤖 Claude: Issue Picked Up\nIssue **#${issueNumber}** is eligible. Starting implementation now...`);
            core.setOutput('eligible', 'true');

      - name: Create Feature Branch
        id: branch
        if: steps.eligibility.outputs.eligible == 'true'
        run: |
          ISSUE_NUMBER=${{ github.event.issue.number }}
          CLEAN_TITLE=$(echo "${{ github.event.issue.title }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | cut -c1-40)
          BRANCH_NAME="claude-issue-${ISSUE_NUMBER}-${CLEAN_TITLE}"
          git fetch origin "$CLAUDE_BASE_BRANCH" --depth=1
          git checkout "$CLAUDE_BASE_BRANCH"
          git push origin --delete "$BRANCH_NAME" 2>/dev/null || true
          git checkout -b "$BRANCH_NAME"
          git push origin "$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Get Existing Files List
        id: existing-files
        if: steps.eligibility.outputs.eligible == 'true'
        run: |
          git fetch origin "$CLAUDE_BASE_BRANCH" --depth=1
          git ls-tree -r "origin/$CLAUDE_BASE_BRANCH" --name-only > /tmp/existing_files.txt

      - name: Claude Implement Code
        id: claude
        if: steps.eligibility.outputs.eligible == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --model claude-sonnet-4-6
            --allowedTools "Edit,Write,Read,Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(cat:*),Bash(ls:*),Bash(find:*),Bash(grep:*),Bash(gh issue view:*),Bash(gh issue comment:*)"
          prompt: |
            You are a fully autonomous developer on issue #${{ github.event.issue.number }}.
            Branch: ${{ steps.branch.outputs.branch_name }} (already created — do NOT create another).

            REPO: React UI in ui/ + Python Flask API in api/.
            PR creation and issue comments are handled by the workflow AFTER you push — do NOT run npm, pip, pytest, build, or gh pr commands.

            ## BLOCKER RULE:
            If blocked → post issue comment with exact error → write BLOCKED=true to /tmp/pr_summary.txt → STOP.
            gh issue comment ${{ github.event.issue.number }} --body "## 🚫 Blocked\n**At:** [step]\n**Error:** [exact]\n**Needed:** [action]"

            ## STEP 1 — READ ISSUE:
            gh issue view ${{ github.event.issue.number }}
            If unclear → post clarification comment → STOP.

            ## STEP 2 — UNDERSTAND CODEBASE:
            Do NOT read all of /tmp/existing_files.txt — use grep/find for paths relevant to this issue.
            Read package.json, requirements.txt, and existing tests only as needed.

            ## STEP 3 — IMPLEMENT:
            - NEVER modify files listed in /tmp/existing_files.txt unless required for this issue
            - Keep diff small — only this issue, no unrelated changes
            - Write tests for all new/modified behavior
            - Match existing code style exactly
            - Work from ui/ for frontend changes and api/ for backend changes

            ## STEP 4 — COMMIT AND PUSH:
            git add . && git commit -m "feat: implement issue #${{ github.event.issue.number }} — ${{ github.event.issue.title }}" && git push origin ${{ steps.branch.outputs.branch_name }}

            ## STEP 5 — WRITE /tmp/pr_summary.txt (implementation metadata only):
            BLOCKED=false
            IMPLEMENTATION_SUMMARY=[paragraph describing what was implemented]
            FILES_CREATED=[comma-separated list]
            FILES_MODIFIED=[comma-separated list]
            TESTS_WRITTEN=[comma-separated list]
            KNOWN_LIMITATIONS=[or none]
            RISKS=[or none]

            SAFETY: Never force push, auto-merge, auto-close, delete branches, or move project status.

      - name: Check Blocked Status
        id: blocked
        if: steps.eligibility.outputs.eligible == 'true'
        run: |
          if grep -q '^BLOCKED=true' /tmp/pr_summary.txt 2>/dev/null; then
            echo "blocked=true" >> $GITHUB_OUTPUT
          else
            echo "blocked=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare Implementation Summary
        id: summary
        if: steps.eligibility.outputs.eligible == 'true' && steps.blocked.outputs.blocked != 'true'
        run: |
          if [ ! -f /tmp/pr_summary.txt ]; then
            {
              echo "BLOCKED=false"
              echo "IMPLEMENTATION_SUMMARY=Implemented by Claude AI"
              echo "FILES_CREATED=N/A"
              echo "FILES_MODIFIED=N/A"
              echo "TESTS_WRITTEN=N/A"
              echo "KNOWN_LIMITATIONS=none"
              echo "RISKS=none"
            } > /tmp/pr_summary.txt
          fi

      - name: Create Pull Request
        id: create-pr
        if: steps.eligibility.outputs.eligible == 'true' && steps.blocked.outputs.blocked != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list --head ${{ steps.branch.outputs.branch_name }} --json url --jq '.[0].url' 2>/dev/null || echo "")
          if [ -n "$EXISTING_PR" ]; then
            echo "pr_url=$EXISTING_PR" >> $GITHUB_OUTPUT
            echo "pr_number=${EXISTING_PR##*/}" >> $GITHUB_OUTPUT
            exit 0
          fi
          get() { grep "^$1=" /tmp/pr_summary.txt 2>/dev/null | cut -d= -f2- || echo "N/A"; }
          IMPL=$(get IMPLEMENTATION_SUMMARY)
          FC=$(get FILES_CREATED)
          FM=$(get FILES_MODIFIED)
          TW=$(get TESTS_WRITTEN)
          KL=$(get KNOWN_LIMITATIONS)
          RK=$(get RISKS)
          PR_URL=$(gh pr create \
            --title "[Claude - Issue #${{ github.event.issue.number }}] ${{ github.event.issue.title }}" \
            --base "$CLAUDE_BASE_BRANCH" \
            --head ${{ steps.branch.outputs.branch_name }} \
            --label "claude-review" \
            --body "$(cat <<BODY
## 🤖 Claude Implementation
Fixes #${{ github.event.issue.number }}
## Summary
${IMPL}
## Changes Made
**Files Created:** ${FC} | **Files Modified:** ${FM} | **Tests Written:** ${TW}
## Known Limitations
${KL}
## Risks
${RK}
BODY
)")
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "pr_number=${PR_URL##*/}" >> $GITHUB_OUTPUT
          gh pr view --json labels | grep -q tensure-claude-bot || gh pr edit --add-label "tensure-claude-bot"
          echo "PR_URL=$PR_URL" >> /tmp/pr_summary.txt

      - name: Post Success Comment
        id: post-success
        if: steps.eligibility.outputs.eligible == 'true' && steps.blocked.outputs.blocked != 'true' && steps.create-pr.outputs.pr_url != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const issueNumber = context.issue.number;
            try { await github.rest.issues.getLabel({ owner, repo, name: 'claude-done' }); }
            catch { await github.rest.issues.createLabel({ owner, repo, name: 'claude-done', color: '0e8a16', description: 'Issue implemented by Claude' }); }
            await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: ['claude-done'] });
            try { await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: 'claude-ready' }); } catch(e) {}
            await github.rest.issues.createComment({
              owner, repo, issue_number: issueNumber,
              body: `## ✅ Claude: Implementation Successful\nPR created and ready for review.\n\n**PR:** ${{ steps.create-pr.outputs.pr_url }}\n**Branch:** \`${{ steps.branch.outputs.branch_name }}\`\n\n> \`claude-done\` label added — issue won't be re-processed.\n\n👨‍💻 Please review and approve to merge.`
            });

      - name: Trigger Claude Review Workflow
        id: trigger-review
        if: steps.eligibility.outputs.eligible == 'true' && steps.blocked.outputs.blocked != 'true' && steps.create-pr.outputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'claude-review',
              client_payload: {
                pr_number: '${{ steps.create-pr.outputs.pr_number }}'
              }
            });
            console.log('✅ claude-review dispatch sent for PR #${{ steps.create-pr.outputs.pr_number }}');

      - name: Post Failure Comment
        if: failure() && steps.create-pr.outputs.pr_url == ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const outcomes = {
              'Checkout':           '${{ steps.checkout.outcome }}',
              'Configure Git':      '${{ steps.configure-git.outcome }}',
              'Eligibility Check':  '${{ steps.eligibility.outcome }}',
              'Create Branch':      '${{ steps.branch.outcome }}',
              'Get Existing Files': '${{ steps.existing-files.outcome }}',
              'Claude Implement':   '${{ steps.claude.outcome }}',
              'Prepare Summary':    '${{ steps.summary.outcome }}',
              'Create PR':          '${{ steps.create-pr.outcome }}',
              'Post Success':       '${{ steps.post-success.outcome }}',
              'Trigger Review':     '${{ steps.trigger-review.outcome }}',
            };
            const failed = Object.entries(outcomes).filter(([,v])=>v==='failure').map(([k])=>`❌ ${k}`);
            let blocker = '';
            try { if (fs.readFileSync('/tmp/pr_summary.txt','utf8').includes('BLOCKED=true')) blocker = '\n> ⚠️ Claude reported a blocker — check comments above for details.'; } catch(e) {}
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ❌ Claude: Implementation Failed${blocker}\n\nFailed at: ${failed.join(', ')||'unknown step'}\n\n🔍 [View Actions log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\nRemove \`claude-ready\` label and re-add to retry.`
            });
