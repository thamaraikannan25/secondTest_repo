name: Claude Issue Implementation

on:
  issues:
    types: [labeled]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 60                    # ← increased from 20
    if: github.event.label.name == 'claude-ready'
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      repository-projects: write

    steps:
      # ─────────────────────────────────────────
      # STEP 1 — Checkout main branch
      # ─────────────────────────────────────────
      - name: Checkout main branch
        id: checkout                       # ← added id
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────────
      # STEP 2 — Configure Git
      # ─────────────────────────────────────────
      - name: Configure Git
        id: configure-git                  # ← added id
        run: |
          git config user.name "claude-bot"
          git config user.email "claude-bot@users.noreply.github.com"

      # ─────────────────────────────────────────
      # STEP 3 — Eligibility Check
      # ─────────────────────────────────────────
      - name: Check Issue Eligibility
        id: eligibility
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const { data: issue } = await github.rest.issues.get({
              owner, repo, issue_number: issueNumber
            });

            if (issue.pull_request) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: `## ❌ Claude: Not Starting\n\n**Reasons:**\n- This is a Pull Request, not an Issue\n\n> No branch or code changes have been made.`
              });
              core.setOutput('eligible', 'false');
              return;
            }

            if (issue.state === 'closed') {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: `## ❌ Claude: Not Starting\n\n**Reasons:**\n- Issue is closed\n\n> No branch or code changes have been made.`
              });
              core.setOutput('eligible', 'false');
              return;
            }

            const { data: prs } = await github.rest.pulls.list({
              owner, repo, state: 'open'
            });
            const existingPR = prs.find(pr =>
              pr.body && (
                pr.body.includes(`#${issueNumber}`) ||
                pr.body.includes(`Fixes #${issueNumber}`) ||
                pr.body.includes(`Closes #${issueNumber}`)
              )
            );
            if (existingPR) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: `## ⚠️ Claude: Not Starting — Duplicate PR\n\nAn active PR already exists: ${existingPR.html_url}\n\nPlease close or merge the existing PR before re-triggering.\n\n> No branch or code changes have been made.`
              });
              core.setOutput('eligible', 'false');
              return;
            }

            if (!issue.body || issue.body.trim().length < 10) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: `## ❓ Claude: Clarification Needed\n\nBefore I can start, I need clarification on:\n- Issue description is missing or too short\n- Please provide:\n  - Clear objective\n  - Actionable scope\n  - Acceptance criteria or testable outcome\n\n> No branch or code changes have been made.`
              });
              core.setOutput('eligible', 'false');
              return;
            }

            console.log('✅ Issue is eligible');
            core.setOutput('eligible', 'true');

      # ─────────────────────────────────────────
      # STEP 4 — Post Eligible Comment
      # ─────────────────────────────────────────
      - name: Post Eligible Comment
        id: post-eligible                  # ← added id
        if: steps.eligibility.outputs.eligible == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ✅ Claude: Eligible — Process Started

              Pre-checks passed. Beginning implementation now.

              **Steps:**
              - 🔄 Moving to In Progress
              - 🌿 Creating branch
              - ⚙️ Implementing code
              - ✅ Running build + test validation
              - 🔀 Opening PR with validation proof
              - 🔍 Moving to In Review

              > This issue is being handled autonomously by Claude.`
            });

      # ─────────────────────────────────────────
      # STEP 5 — Move Issue Backlog → In Progress
      # ─────────────────────────────────────────
      - name: Move Issue to In Progress
        if: steps.eligibility.outputs.eligible == 'true'
        id: in-progress
        continue-on-error: true            # ← board update should not fail workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            console.log(`🔍 Looking for issue #${issueNumber} in projects...`);

            const query = `
              query {
                repository(owner: "${owner}", name: "${repo}") {
                  issue(number: ${issueNumber}) {
                    projectItems(first: 10) {
                      nodes {
                        id
                        project {
                          id
                          number
                          title
                          fields(first: 20) {
                            nodes {
                              ... on ProjectV2SingleSelectField {
                                id
                                name
                                options {
                                  id
                                  name
                                }
                              }
                            }
                          }
                        }
                        fieldValues(first: 20) {
                          nodes {
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              name
                              field {
                                ... on ProjectV2SingleSelectField {
                                  name
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query);
            const items = result.repository.issue.projectItems.nodes;

            if (items.length === 0) {
              console.log('❌ Issue not linked to any project');
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: `## ⚠️ Claude: Project Status Update Failed\n\n- Issue is not linked to any GitHub Project board\n- Please add this issue to your project board manually\n- Implementation will continue regardless`
              });
              return;
            }

            for (const item of items) {
              const fields = item.project.fields.nodes;
              const statusField = fields.find(f => f.name === 'Status');
              if (!statusField) {
                console.log('❌ No Status field found');
                continue;
              }

              const currentStatusValue = item.fieldValues.nodes.find(
                v => v.field && v.field.name === 'Status'
              );
              const currentStatus = currentStatusValue?.name?.toLowerCase() || '';
              console.log(`Current status: ${currentStatus}`);

              const laterStatuses = ['in progress', 'in review', 'done', 'complete', 'merged'];
              const isAlreadyLater = laterStatuses.some(s => currentStatus.includes(s));

              if (isAlreadyLater) {
                console.log(`⏭️ Status is already "${currentStatus}" — not moving backward`);
                continue;
              }

              console.log(`Available options: ${statusField.options.map(o => o.name).join(', ')}`);

              const inProgressOption = statusField.options.find(
                o => o.name.toLowerCase().includes('in progress')
              );

              if (!inProgressOption) {
                console.log('❌ No In Progress option found');
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issueNumber,
                  body: `## ⚠️ Claude: Could Not Move to In Progress\n\n- No "In Progress" status option found in project board\n- Available options: ${statusField.options.map(o => o.name).join(', ')}\n- Please move manually\n- Implementation will continue regardless`
                });
                continue;
              }

              await github.graphql(`
                mutation {
                  updateProjectV2ItemFieldValue(
                    input: {
                      projectId: "${item.project.id}"
                      itemId: "${item.id}"
                      fieldId: "${statusField.id}"
                      value: { singleSelectOptionId: "${inProgressOption.id}" }
                    }
                  ) {
                    projectV2Item { id }
                  }
                }
              `);

              console.log(`✅ Issue #${issueNumber} moved to In Progress`);
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: `## 🔄 Claude: Status Updated\n\n- ✅ Issue moved to **In Progress** on project board\n- 🌿 Creating branch and starting implementation...`
              });
            }

      # ─────────────────────────────────────────
      # STEP 6 — Create Feature Branch
      # ─────────────────────────────────────────
      - name: Create Feature Branch
        if: steps.eligibility.outputs.eligible == 'true'
        id: branch
        run: |
          ISSUE_NUMBER=${{ github.event.issue.number }}
          ISSUE_TITLE="${{ github.event.issue.title }}"
          CLEAN_TITLE=$(echo "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | cut -c1-40)
          BRANCH_NAME="claude-issue-${ISSUE_NUMBER}-${CLEAN_TITLE}"
          echo "Creating branch: $BRANCH_NAME"

          git push origin --delete "$BRANCH_NAME" 2>/dev/null || echo "Branch doesnt exist remotely — creating fresh"
          git checkout -b "$BRANCH_NAME"
          git push origin "$BRANCH_NAME"

          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "✅ Branch created: $BRANCH_NAME"

      # ─────────────────────────────────────────
      # STEP 7 — Post Branch Created Comment
      # ─────────────────────────────────────────
      - name: Post Branch Created Comment
        id: post-branch                    # ← added id
        if: steps.eligibility.outputs.eligible == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🌿 Claude: Branch Created

              - **Branch:** \`${{ steps.branch.outputs.branch_name }}\`
              - ⚙️ Starting code implementation now...`
            });

      # ─────────────────────────────────────────
      # STEP 8 — Get existing files for protection
      # ─────────────────────────────────────────
      - name: Get Existing Files List
        id: existing-files                 # ← added id
        if: steps.eligibility.outputs.eligible == 'true'
        run: |
          git ls-tree -r main --name-only > /tmp/existing_files.txt
          echo "=== Existing files ===" && cat /tmp/existing_files.txt

      # ─────────────────────────────────────────
      # STEP 9 — Claude implements + validates + creates PR
      # ─────────────────────────────────────────
      - name: Claude Implement Code
        if: steps.eligibility.outputs.eligible == 'true'
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --model claude-sonnet-4-6
            --allowedTools "Edit,Write,Read,Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(cat:*),Bash(ls:*),Bash(find:*),Bash(grep:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr edit:*),Bash(gh pr comment:*),Bash(gh label create:*),Bash(gh label list:*),Bash(npm run build:*),Bash(npm test:*),Bash(npm run test:*),Bash(npm run coverage:*),Bash(npm run lint:*)"
          prompt: |
            You are a fully autonomous developer on issue #${{ github.event.issue.number }}.
            Branch already created: ${{ steps.branch.outputs.branch_name }}
            You are already on this branch — do NOT create another branch.
            Do NOT move project status — handled by workflow.
            Do NOT add claude-done label — handled by workflow.

            ## BLOCKER RULE (HIGHEST PRIORITY):
            If blocked at ANY point (permissions, missing config, integration errors):
            - Do NOT hack around it
            - Do NOT guess
            - Post exact blocker on issue:
              gh issue comment ${{ github.event.issue.number }} \
                --body "## 🚫 Claude: Blocked
                **Blocked at:** [step name]
                **Exact error:** [full error message]
                **Why cannot auto-resolve:** [reason]
                **What is needed:** [exact action to unblock]"
            - Write BLOCKED=true to /tmp/pr_summary.txt
            - STOP immediately

            ---

            ## STEP 1 — READ ISSUE:
            - Run: gh issue view ${{ github.event.issue.number }}
            - Read title: "${{ github.event.issue.title }}"
            - Understand fully: objective, scope, acceptance criteria
            - If still unclear after reading → post clarification comment → STOP

            ## STEP 2 — UNDERSTAND CODEBASE:
            - Read /tmp/existing_files.txt for full repo structure
            - Read relevant existing files for patterns and conventions
            - Read existing tests to understand test patterns
            - Run: cat package.json to check available scripts
            - Read domain files to understand data models
            - Match existing code style exactly

            ## STEP 3 — IMPLEMENT:
            - NEVER modify files in /tmp/existing_files.txt unless absolutely required
            - NEVER break existing functionality
            - Keep diff small — only this issue, no unrelated refactors
            - Write tests for all new code or modified behavior
            - Follow exact same code style and conventions
            - If blocked at any point → follow BLOCKER RULE above

            ## STEP 4 — VALIDATE (MANDATORY — per routine instructions):
            First check available scripts:
            Run: cat package.json | grep -A 20 '"scripts"'

            ### For React/UI changes:
            - Run: npm run build
            - Capture FULL output — do not truncate
            - If build fails → attempt fix → re-run
            - Record: pass / fail / not_configured

            ### For test coverage (UI or API):
            - Run: npm test -- --watchAll=false --coverage
            - Capture FULL output including pass/fail counts
            - Capture coverage percentage before → after
            - If tests fail → attempt fix → re-run
            - Record: pass / fail / not_configured

            ### If scripts do NOT exist:
            - Record: not_configured
            - Note exactly which script is missing

            ### If validation FAILS after fix attempt:
            - Do NOT hide failure
            - Record exact failure logs
            - Record probable cause
            - Record next-step fix plan
            - Include all failure details in PR body

            ## STEP 5 — COMMIT AND PUSH:
            - git add .
            - git commit -m "feat: implement issue #${{ github.event.issue.number }} — ${{ github.event.issue.title }}"
            - git push origin ${{ steps.branch.outputs.branch_name }}

            ## STEP 6 — CREATE PR (per routine instructions):
            gh pr create \
              --title "[Claude - Issue #${{ github.event.issue.number }}] ${{ github.event.issue.title }}" \
              --base main \
              --head ${{ steps.branch.outputs.branch_name }} \
              --label "claude-review" \
              --body "## 🤖 Claude Implementation

            Fixes #${{ github.event.issue.number }}

            ## Summary
            [Detailed description of what was implemented]

            ## Changes Made
            **Files Created:** [list each file]
            **Files Modified:** [list each file]
            **Tests Written:** [list each test file]

            ## Test Plan
            - Review changed files listed above
            - Run existing test suite
            - Verify acceptance criteria from issue #${{ github.event.issue.number }}

            ## Validation Result
            ### Build Status
            [✅ pass / ❌ fail / ⏭️ not_configured] — [full build output summary]

            ### Test Status
            [✅ pass / ❌ fail / ⏭️ not_configured] — [full test results with counts]

            ### Coverage
            Before: [X%] → After: [Y%]

            ## Known Limitations / Follow-ups
            [List or none]

            ## Risks / Open Questions
            [List or none]"

            ## STEP 7 — VERIFY claude-review LABEL ON PR:
            - Run: gh pr view --json labels
            - If label missing:
              - Run: gh label list | grep claude-review
              - If not exists: gh label create "claude-review" --color "0075ca" --description "PR ready for Claude review"
              - Run: gh pr edit --add-label "claude-review"
              - If still fails → add PR comment:
                "claude-review: Label could not be applied automatically —
                 please manually add 'claude-review' to this PR"

            ## STEP 8 — ATTACH VALIDATION EVIDENCE TO PR (MANDATORY — per routine instructions):
            Post PR comment with FULL validation proof:
            gh pr comment --body "## 🔍 Claude: Validation Evidence

            ### Build Result
            [✅/❌/⏭️] **[build_status]**
            \`\`\`
            [FULL build output — do not truncate]
            \`\`\`

            ### Test Result
            [✅/❌/⏭️] **[test_status]**
            \`\`\`
            [FULL test output with pass/fail counts — do not truncate]
            \`\`\`

            ### Coverage Summary
            Before: [X%] → After: [Y%]

            > Evidence automatically attached by Claude bot"

            ## STEP 9 — WRITE SUMMARY FILE (MANDATORY):
            Write ALL fields to /tmp/pr_summary.txt in EXACT format:

            BLOCKED=false
            IMPLEMENTATION_SUMMARY=[one paragraph what was implemented]
            FILES_CREATED=[comma separated list]
            FILES_MODIFIED=[comma separated list]
            TESTS_WRITTEN=[comma separated list]
            BUILD_STATUS=[pass/fail/not_configured]
            BUILD_OUTPUT=[one line summary]
            TEST_STATUS=[pass/fail/not_configured]
            TEST_OUTPUT=[one line with pass/fail counts]
            COVERAGE_BEFORE=[percentage or N/A]
            COVERAGE_AFTER=[percentage or N/A]
            PR_URL=[full pr url]
            KNOWN_LIMITATIONS=[or none]
            RISKS=[or none]

            ## SAFETY RULES:
            - NEVER force push to protected branches
            - NEVER auto-merge
            - NEVER auto-close issues
            - NEVER auto-delete branches
            - NEVER add claude-done label — workflow handles it
            - NEVER move project status — workflow handles it
            - If uncertain about a fix → comment instead of guessing
            - Log every action taken

      # ─────────────────────────────────────────
      # STEP 10 — Post Implementation Comment
      # ─────────────────────────────────────────
      - name: Post Implementation Complete Comment
        id: post-implementation            # ← added id
        if: steps.eligibility.outputs.eligible == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ⚙️ Claude: Code Implementation Complete

              - ✅ Code implemented
              - ✅ Tests written
              - ✅ Build + test validation run
              - ✅ Validation evidence attached to PR
              - 🔀 PR created — checking labels...`
            });

      # ─────────────────────────────────────────
      # STEP 11 — Fallback PR if Claude skipped
      # ─────────────────────────────────────────
      - name: Fallback PR Creation
        if: steps.eligibility.outputs.eligible == 'true'
        id: create-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if Claude already created the PR
          EXISTING_PR=$(gh pr list \
            --head ${{ steps.branch.outputs.branch_name }} \
            --json url --jq '.[0].url' 2>/dev/null || echo "")

          if [ -n "$EXISTING_PR" ]; then
            echo "✅ PR already created by Claude: $EXISTING_PR"
            echo "pr_url=$EXISTING_PR" >> $GITHUB_OUTPUT
            echo "pr_number=${EXISTING_PR##*/}" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Claude did not create PR — creating fallback PR"
            IMPL_SUMMARY=$(grep '^IMPLEMENTATION_SUMMARY=' /tmp/pr_summary.txt 2>/dev/null | cut -d= -f2- || echo "Automatically implemented by Claude AI")
            FILES_CREATED=$(grep '^FILES_CREATED=' /tmp/pr_summary.txt 2>/dev/null | cut -d= -f2- || echo "See diff")
            FILES_MODIFIED=$(grep '^FILES_MODIFIED=' /tmp/pr_summary.txt 2>/dev/null | cut -d= -f2- || echo "See diff")
            TESTS_WRITTEN=$(grep '^TESTS_WRITTEN=' /tmp/pr_summary.txt 2>/dev/null | cut -d= -f2- || echo "See diff")
            BUILD_STATUS=$(grep '^BUILD_STATUS=' /tmp/pr_summary.txt 2>/dev/null | cut -d= -f2- || echo "not_run")
            BUILD_OUTPUT=$(grep '^BUILD_OUTPUT=' /tmp/pr_summary.txt 2>/dev/null | cut -d= -f2- || echo "N/A")
            TEST_STATUS=$(grep '^TEST_STATUS=' /tmp/pr_summary.txt 2>/dev/null | cut -d= -f2- || echo "not_run")
            TEST_OUTPUT=$(grep '^TEST_OUTPUT=' /tmp/pr_summary.txt 2>/dev/null | cut -d= -f2- || echo "N/A")
            COVERAGE_BEFORE=$(grep '^COVERAGE_BEFORE=' /tmp/pr_summary.txt 2>/dev/null | cut -d= -f2- || echo "N/A")
            COVERAGE_AFTER=$(grep '^COVERAGE_AFTER=' /tmp/pr_summary.txt 2>/dev/null | cut -d= -f2- || echo "N/A")
            KNOWN_LIMITATIONS=$(grep '^KNOWN_LIMITATIONS=' /tmp/pr_summary.txt 2>/dev/null | cut -d= -f2- || echo "None identified")
            RISKS=$(grep '^RISKS=' /tmp/pr_summary.txt 2>/dev/null | cut -d= -f2- || echo "None identified")

            BUILD_EMOJI=$([ "$BUILD_STATUS" = "pass" ] && echo "✅" || [ "$BUILD_STATUS" = "not_run" ] && echo "⏭️" || echo "❌")
            TEST_EMOJI=$([ "$TEST_STATUS" = "pass" ] && echo "✅" || [ "$TEST_STATUS" = "not_run" ] && echo "⏭️" || echo "❌")

            PR_URL=$(gh pr create \
              --title "[Claude - Issue #${{ github.event.issue.number }}] ${{ github.event.issue.title }}" \
              --body "## 🤖 Claude Implementation

            Fixes #${{ github.event.issue.number }}

            ## Summary
            ${IMPL_SUMMARY}

            ## Changes Made
            **Files Created:** ${FILES_CREATED}
            **Files Modified:** ${FILES_MODIFIED}
            **Tests Written:** ${TESTS_WRITTEN}

            ## Test Plan
            - Review changed files listed above
            - Run existing test suite
            - Verify acceptance criteria from issue #${{ github.event.issue.number }}

            ## Validation Result
            ### Build Status
            ${BUILD_EMOJI} ${BUILD_STATUS} — ${BUILD_OUTPUT}

            ### Test Status
            ${TEST_EMOJI} ${TEST_STATUS} — ${TEST_OUTPUT}

            ### Coverage
            Before: ${COVERAGE_BEFORE} → After: ${COVERAGE_AFTER}

            ## Known Limitations / Follow-ups
            ${KNOWN_LIMITATIONS}

            ## Risks / Open Questions
            ${RISKS}" \
              --base main \
              --head ${{ steps.branch.outputs.branch_name }} \
              --label "claude-review")

            echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
            echo "pr_number=${PR_URL##*/}" >> $GITHUB_OUTPUT
            echo "✅ Fallback PR created: $PR_URL"
          fi

      # ─────────────────────────────────────────
      # STEP 12 — Attach validation evidence to PR
      #           (fallback if Claude skipped it)
      # ─────────────────────────────────────────
      - name: Attach Validation Evidence to PR
        id: attach-evidence                # ← added id
        if: steps.eligibility.outputs.eligible == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const prNumber = '${{ steps.create-pr.outputs.pr_number }}';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Check if evidence already posted by Claude
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: parseInt(prNumber)
            });
            const alreadyPosted = comments.some(c =>
              c.body && c.body.includes('Claude: Validation Evidence')
            );

            if (alreadyPosted) {
              console.log('✅ Validation evidence already posted by Claude — skipping');
              return;
            }

            // Claude skipped — post from summary file
            let buildOutput = 'N/A';
            let testOutput = 'N/A';
            let buildStatus = 'not_run';
            let testStatus = 'not_run';
            let coverageBefore = 'N/A';
            let coverageAfter = 'N/A';

            try {
              const summary = fs.readFileSync('/tmp/pr_summary.txt', 'utf8');
              for (const line of summary.split('\n')) {
                if (line.startsWith('BUILD_OUTPUT=')) buildOutput = line.split('=').slice(1).join('=');
                if (line.startsWith('TEST_OUTPUT=')) testOutput = line.split('=').slice(1).join('=');
                if (line.startsWith('BUILD_STATUS=')) buildStatus = line.split('=')[1];
                if (line.startsWith('TEST_STATUS=')) testStatus = line.split('=')[1];
                if (line.startsWith('COVERAGE_BEFORE=')) coverageBefore = line.split('=')[1];
                if (line.startsWith('COVERAGE_AFTER=')) coverageAfter = line.split('=')[1];
              }
            } catch (e) {
              console.log('No summary file found — evidence unavailable');
            }

            const buildEmoji = buildStatus === 'pass' ? '✅' : buildStatus === 'not_run' ? '⏭️' : '❌';
            const testEmoji = testStatus === 'pass' ? '✅' : testStatus === 'not_run' ? '⏭️' : '❌';

            await github.rest.issues.createComment({
              owner, repo,
              issue_number: parseInt(prNumber),
              body: `## 🔍 Claude: Validation Evidence

              ### Build Result
              ${buildEmoji} **${buildStatus}**
              \`\`\`
              ${buildOutput}
              \`\`\`

              ### Test Result
              ${testEmoji} **${testStatus}**
              \`\`\`
              ${testOutput}
              \`\`\`

              ### Coverage Summary
              Before: ${coverageBefore} → After: ${coverageAfter}

              > Evidence attached by workflow fallback`
            });

      # ─────────────────────────────────────────
      # STEP 13 — Verify claude-review label on PR
      # ─────────────────────────────────────────
      - name: Verify claude-review Label on PR
        id: verify-label                   # ← added id
        if: steps.eligibility.outputs.eligible == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = '${{ steps.create-pr.outputs.pr_number }}';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: parseInt(prNumber)
            });

            const hasLabel = pr.labels.some(l => l.name === 'claude-review');

            if (!hasLabel) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: 'claude-review' });
              } catch {
                await github.rest.issues.createLabel({
                  owner, repo, name: 'claude-review', color: '0075ca',
                  description: 'PR ready for Claude review'
                });
                console.log('✅ claude-review label created');
              }
              try {
                await github.rest.issues.addLabels({
                  owner, repo,
                  issue_number: parseInt(prNumber),
                  labels: ['claude-review']
                });
                console.log('✅ claude-review label applied to PR');
              } catch (e) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: parseInt(prNumber),
                  body: `claude-review: Label could not be applied automatically — please manually add 'claude-review' to this PR`
                });
              }
            } else {
              console.log('✅ claude-review label already present');
            }

      # ─────────────────────────────────────────
      # STEP 14 — Add claude-done label to issue
      # ─────────────────────────────────────────
      - name: Add claude-done Label to Issue
        id: claude-done                    # ← added id
        if: steps.eligibility.outputs.eligible == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            try {
              await github.rest.issues.getLabel({ owner, repo, name: 'claude-done' });
            } catch {
              await github.rest.issues.createLabel({
                owner, repo, name: 'claude-done', color: '0e8a16',
                description: 'Issue implemented by Claude'
              });
              console.log('✅ claude-done label created');
            }

            await github.rest.issues.addLabels({
              owner, repo,
              issue_number: context.issue.number,
              labels: ['claude-done']
            });
            console.log('✅ claude-done label added to issue');

      # ─────────────────────────────────────────
      # STEP 15 — Move Issue to In Review
      # ─────────────────────────────────────────
      - name: Move Issue to In Review
        if: steps.eligibility.outputs.eligible == 'true'
        id: in-review
        continue-on-error: true            # ← board update should not fail workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const query = `
              query {
                repository(owner: "${owner}", name: "${repo}") {
                  issue(number: ${issueNumber}) {
                    projectItems(first: 10) {
                      nodes {
                        id
                        project {
                          id
                          fields(first: 20) {
                            nodes {
                              ... on ProjectV2SingleSelectField {
                                id
                                name
                                options {
                                  id
                                  name
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query);
            const items = result.repository.issue.projectItems.nodes;

            if (items.length === 0) {
              console.log('Issue not linked to any project — skipping');
              return;
            }

            for (const item of items) {
              const fields = item.project.fields.nodes;
              const statusField = fields.find(f => f.name === 'Status');
              if (!statusField) continue;

              const inReviewOption = statusField.options.find(
                o => o.name.toLowerCase().includes('in review') ||
                     o.name.toLowerCase().includes('review')
              );

              if (!inReviewOption) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issueNumber,
                  body: `## ⚠️ Claude: Could Not Move to In Review\n\n- No "In Review" status option found\n- Available options: ${statusField.options.map(o => o.name).join(', ')}\n- Please move manually`
                });
                continue;
              }

              await github.graphql(`
                mutation {
                  updateProjectV2ItemFieldValue(
                    input: {
                      projectId: "${item.project.id}"
                      itemId: "${item.id}"
                      fieldId: "${statusField.id}"
                      value: { singleSelectOptionId: "${inReviewOption.id}" }
                    }
                  ) {
                    projectV2Item { id }
                  }
                }
              `);
              console.log(`✅ Issue #${issueNumber} moved to In Review`);
            }

      # ─────────────────────────────────────────
      # STEP 16 — Post Final Success Comment
      # ─────────────────────────────────────────
      - name: Post Final Success Comment
        id: post-success                   # ← added id
        if: steps.eligibility.outputs.eligible == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let implSummary = 'Automatically implemented by Claude AI';
            let buildStatus = 'not_run';
            let testStatus = 'not_run';
            let coverageBefore = 'N/A';
            let coverageAfter = 'N/A';
            let risks = 'None';

            try {
              const summary = fs.readFileSync('/tmp/pr_summary.txt', 'utf8');
              for (const line of summary.split('\n')) {
                if (line.startsWith('IMPLEMENTATION_SUMMARY=')) implSummary = line.split('=').slice(1).join('=');
                if (line.startsWith('BUILD_STATUS=')) buildStatus = line.split('=')[1];
                if (line.startsWith('TEST_STATUS=')) testStatus = line.split('=')[1];
                if (line.startsWith('COVERAGE_BEFORE=')) coverageBefore = line.split('=')[1];
                if (line.startsWith('COVERAGE_AFTER=')) coverageAfter = line.split('=')[1];
                if (line.startsWith('RISKS=')) risks = line.split('=').slice(1).join('=');
              }
            } catch (e) {
              console.log('No summary file');
            }

            const buildEmoji = buildStatus === 'pass' ? '✅' : buildStatus === 'not_run' ? '⏭️' : '❌';
            const testEmoji = testStatus === 'pass' ? '✅' : testStatus === 'not_run' ? '⏭️' : '❌';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ✅ Claude: Implementation Complete

              **PR:** ${{ steps.create-pr.outputs.pr_url }}
              **Branch:** \`${{ steps.branch.outputs.branch_name }}\`
              **Status:** Moved to **In Review** 🔍

              ## Implementation Summary
              ${implSummary}

              ## Validation Summary
              - Build: ${buildEmoji} ${buildStatus}
              - Tests: ${testEmoji} ${testStatus}
              - Coverage: ${coverageBefore} → ${coverageAfter}

              ## Evidence
              Full validation output attached as PR comment.

              ## Risks / Open Questions
              ${risks}

              ## Workflow Summary
              - ✅ Eligibility checked and passed
              - ✅ Issue moved to In Progress
              - ✅ Branch created: \`${{ steps.branch.outputs.branch_name }}\`
              - ✅ Code implemented and tests written
              - ✅ Build + test validation run
              - ✅ PR created with claude-review label
              - ✅ Validation evidence attached to PR
              - ✅ claude-done label added to issue
              - ✅ Issue moved to In Review

              👨‍💻 **Please review the PR and approve to merge.**`
            });

      # ─────────────────────────────────────────
      # STEP 17 — Post Detailed Failure Comment
      # ─────────────────────────────────────────
      - name: Post Failure Comment
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            // Track exact step that failed
            const steps = {
              'checkout':            { name: 'Checkout main branch',         status: '${{ steps.checkout.outcome }}' },
              'configure-git':       { name: 'Configure Git',                status: '${{ steps.configure-git.outcome }}' },
              'eligibility':         { name: 'Check Issue Eligibility',      status: '${{ steps.eligibility.outcome }}' },
              'post-eligible':       { name: 'Post Eligible Comment',        status: '${{ steps.post-eligible.outcome }}' },
              'in-progress':         { name: 'Move Issue to In Progress',    status: '${{ steps.in-progress.outcome }}' },
              'branch':              { name: 'Create Feature Branch',        status: '${{ steps.branch.outcome }}' },
              'post-branch':         { name: 'Post Branch Created Comment',  status: '${{ steps.post-branch.outcome }}' },
              'existing-files':      { name: 'Get Existing Files List',      status: '${{ steps.existing-files.outcome }}' },
              'claude':              { name: 'Claude Implement Code',        status: '${{ steps.claude.outcome }}' },
              'post-implementation': { name: 'Post Implementation Comment',  status: '${{ steps.post-implementation.outcome }}' },
              'create-pr':           { name: 'Fallback PR Creation',         status: '${{ steps.create-pr.outcome }}' },
              'attach-evidence':     { name: 'Attach Validation Evidence',   status: '${{ steps.attach-evidence.outcome }}' },
              'verify-label':        { name: 'Verify claude-review Label',   status: '${{ steps.verify-label.outcome }}' },
              'claude-done':         { name: 'Add claude-done Label',        status: '${{ steps.claude-done.outcome }}' },
              'in-review':           { name: 'Move Issue to In Review',      status: '${{ steps.in-review.outcome }}' },
              'post-success':        { name: 'Post Final Success Comment',   status: '${{ steps.post-success.outcome }}' },
            };

            const failedSteps = Object.values(steps)
              .filter(s => s.status === 'failure')
              .map(s => `❌ **${s.name}**`);

            const completedSteps = Object.values(steps)
              .filter(s => s.status === 'success')
              .map(s => `✅ ${s.name}`);

            const skippedSteps = Object.values(steps)
              .filter(s => s.status === 'skipped')
              .map(s => `⏭️ ${s.name}`);

            // Check if Claude reported a blocker
            let claudeBlockerNote = '';
            try {
              const summary = fs.readFileSync('/tmp/pr_summary.txt', 'utf8');
              if (summary.includes('BLOCKED=true')) {
                claudeBlockerNote = '\n\n> ⚠️ **Claude reported a blocker** — check issue comments above for exact error details.';
              }
            } catch (e) {}

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ❌ Claude: Workflow Failed
              ${claudeBlockerNote}

              **Failed at:**
              ${failedSteps.length > 0 ? failedSteps.join('\n') : '❌ Unknown — check Actions log'}

              **Completed before failure:**
              ${completedSteps.length > 0 ? completedSteps.join('\n') : 'None'}

              **Skipped steps:**
              ${skippedSteps.length > 0 ? skippedSteps.join('\n') : 'None'}

              **How to investigate:**
              🔍 [View full Actions log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

              **How to retry:**
              1. Fix the issue shown in the Actions log
              2. Remove \`claude-ready\` label from this issue
              3. Re-add \`claude-ready\` label to trigger again`
            });
