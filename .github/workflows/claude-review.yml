name: Claude PR Review & Auto Fix

on:
  pull_request:
    types: [labeled]
    branches:
      - onboarding
  repository_dispatch:
    types: [claude-review]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CLAUDE_BASE_BRANCH: ${{ vars.CLAUDE_BASE_BRANCH || 'onboarding' }}

jobs:
  review-and-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: |
      (github.event_name == 'repository_dispatch') ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'claude-review' &&
       (github.event.pull_request.base.ref == vars.CLAUDE_BASE_BRANCH ||
        (vars.CLAUDE_BASE_BRANCH == '' && github.event.pull_request.base.ref == 'onboarding')))
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      # ─────────────────────────────────────────
      # STEP 1 — Resolve PR number first (no git needed)
      # ─────────────────────────────────────────
      - name: Resolve PR Number
        id: pr-info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            PR_NUMBER="${{ github.event.client_payload.pr_number }}"
          else
            PR_NUMBER="${{ github.event.pull_request.number }}"
          fi
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

          # Get branch and base using gh CLI (no git needed)
          PR_JSON=$(gh pr view $PR_NUMBER --repo ${{ github.repository }} --json headRefName,baseRefName)
          BRANCH=$(echo "$PR_JSON" | jq -r '.headRefName')
          BASE_BRANCH=$(echo "$PR_JSON" | jq -r '.baseRefName')
          if [ -z "$BASE_BRANCH" ] || [ "$BASE_BRANCH" = "null" ]; then
            BASE_BRANCH="$CLAUDE_BASE_BRANCH"
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "base_branch=$BASE_BRANCH" >> $GITHUB_OUTPUT
          echo "✅ PR #$PR_NUMBER — Head: $BRANCH — Base: $BASE_BRANCH"

      # ─────────────────────────────────────────
      # STEP 2 — Checkout using resolved branch
      # ─────────────────────────────────────────
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.pr-info.outputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────────
      # STEP 3 — Configure Git
      # ─────────────────────────────────────────
      - name: Configure Git
        run: |
          git config user.name "claude-bot"
          git config user.email "claude-bot@users.noreply.github.com"

      # ─────────────────────────────────────────
      # STEP 4 — Get file lists (git available now)
      # ─────────────────────────────────────────
      - name: Get Pre-Existing and New Files
        run: |
          BASE="${{ steps.pr-info.outputs.base_branch }}"
          git fetch origin "$BASE"
          git diff --name-only "origin/$BASE"..HEAD > /tmp/new_files.txt
          git ls-tree -r "origin/$BASE" --name-only > /tmp/existing_files.txt
          echo "=== New files ===" && cat /tmp/new_files.txt
          echo "=== Existing files ===" && cat /tmp/existing_files.txt

      - name: Prepare Loop Status Directory
        run: |
          STATUS_DIR="${RUNNER_TEMP}/claude-review"
          echo "CLAUDE_STATUS_DIR=${STATUS_DIR}" >> "$GITHUB_ENV"
          mkdir -p "$STATUS_DIR"
          cat > "$STATUS_DIR/read_status.sh" << 'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          LOOP_NUM="$1"
          STATUS_FILE="$2"
          PR_NUMBER="$3"
          REPO="$4"
          DEFAULT_STATUS="$5"

          if [ -f "$STATUS_FILE" ]; then
            tr -d '[:space:]' < "$STATUS_FILE"
            exit 0
          fi

          echo "⚠️ Status file missing ($STATUS_FILE) — checking latest PR comments" >&2

          mapfile -t COMMENT_BODIES < <(gh pr view "$PR_NUMBER" --repo "$REPO" --json comments \
            --jq '.comments[-20:] | reverse | .[].body' 2>/dev/null || true)

          if [ "$LOOP_NUM" = "3" ]; then
            for body in "${COMMENT_BODIES[@]}"; do
              if [[ "$body" == *"Claude Review Complete — All Clear!"* ]]; then
                echo "ALL_CLEAR"
                exit 0
              fi
              if [[ "$body" == *"Claude Review — 3 Loops Completed"* ]]; then
                echo "ISSUES_REMAIN"
                exit 0
              fi
            done
            echo "$DEFAULT_STATUS"
            exit 0
          fi

          ALL_CLEAR_MARKER="All Clear after Loop ${LOOP_NUM}/3"
          FIX_MARKER="Auto-Fix Applied — Loop ${LOOP_NUM}/3"
          if [ "$LOOP_NUM" = "1" ]; then
            REVIEW_MARKER="Claude Review — Loop 1/3"
          else
            REVIEW_MARKER="Claude Re-Review — Loop 2/3"
          fi

          # Newest matching comment wins (avoids stale All Clear from earlier runs)
          for body in "${COMMENT_BODIES[@]}"; do
            if [[ "$body" == *"$ALL_CLEAR_MARKER"* ]]; then
              echo "ALL_CLEAR"
              exit 0
            fi
            if [[ "$body" == *"$FIX_MARKER"* ]]; then
              echo "ISSUES_FIXED"
              exit 0
            fi
            if [[ "$body" == *"$REVIEW_MARKER"* ]]; then
              echo "ISSUES_FIXED"
              exit 0
            fi
          done

          echo "$DEFAULT_STATUS"
          SCRIPT
          cat > "$STATUS_DIR/sync_status.sh" << 'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          LOOP_NUM="$1"
          STATUS_FILE="$2"
          PR_NUMBER="$3"
          REPO="$4"
          DEFAULT_STATUS="$5"
          READ_STATUS_SCRIPT="$6"

          # Always resolve from latest PR comments (Claude often skips the status file)
          STATUS=$("$READ_STATUS_SCRIPT" "$LOOP_NUM" "/dev/null/claude-status-pending" \
            "$PR_NUMBER" "$REPO" "$DEFAULT_STATUS")

          echo "$STATUS" > "$STATUS_FILE"
          echo "Synced loop ${LOOP_NUM} status: $STATUS"
          SCRIPT
          cat > "$STATUS_DIR/fetch_open_feedback.sh" << 'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          PR_NUMBER="$1"
          REPO="$2"
          OUTPUT="$3"
          OWNER="${REPO%%/*}"
          NAME="${REPO#*/}"

          {
            echo "# Open PR Feedback"
            echo ""
            echo "PR: ${REPO}#${PR_NUMBER}"
            echo ""

            echo "## Unresolved inline review threads"
            THREADS=$(gh api graphql -f query='
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    reviewThreads(first: 100) {
                      nodes {
                        id
                        isResolved
                        isOutdated
                        path
                        line
                        comments(first: 20) {
                          nodes {
                            body
                            author { login }
                            createdAt
                          }
                        }
                      }
                    }
                  }
                }
              }' -f owner="$OWNER" -f name="$NAME" -F number="$PR_NUMBER" 2>/dev/null || echo '{}')

            UNRESOLVED=$(echo "$THREADS" | jq '[.data.repository.pullRequest.reviewThreads.nodes[]? | select(.isResolved == false)]')
            COUNT=$(echo "$UNRESOLVED" | jq 'length')

            if [ "$COUNT" = "0" ]; then
              echo "_No unresolved inline review threads._"
            else
              # Prominently prefix each thread ID so Claude cannot miss it
              echo "$UNRESOLVED" | jq -r '.[] | "### ⚠️ RESOLVE_THIS_THREAD_ID: \(.id)\n- **File:** `\(.path)` line \(.line // "n/a")\n- **Outdated:** \(.isOutdated)\n**Comments:**\n" + (.comments.nodes | map("- **\(.author.login)** (\(.createdAt)): \(.body)") | join("\n")) + "\n"'
            fi

            echo ""
            echo "## Recent human PR conversation comments"
            HUMAN=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json comments \
              --jq '[.comments[-30:] | reverse | .[] | select(.author.login | test("bot|claude|github-actions"; "i") | not)]' 2>/dev/null || echo '[]')
            HCOUNT=$(echo "$HUMAN" | jq 'length')

            if [ "$HCOUNT" = "0" ]; then
              echo "_No recent human conversation comments._"
            else
              echo "$HUMAN" | jq -r '.[] | "- **\(.author.login)** (\(.createdAt)): \(.body)\n"'
            fi

            echo ""
            echo "## Summary"
            echo "- Unresolved inline threads: ${COUNT}"
            echo "- Recent human conversation comments: ${HCOUNT}"
            if [ "$COUNT" -gt "0" ]; then
              echo ""
              echo "## ❌ BLOCKING: You MUST fix and resolve all $COUNT thread(s) above before posting All Clear."
            fi
          } > "$OUTPUT"

          echo "✅ Open feedback written to $OUTPUT"
          SCRIPT
          # FIX: export GH_TOKEN so gh api graphql works when Claude calls this script
          cat > "$STATUS_DIR/resolve_review_thread.sh" << 'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          export GH_TOKEN="${GH_TOKEN:-$(gh auth token 2>/dev/null)}"

          THREAD_ID="$1"
          if [ -z "$THREAD_ID" ]; then
            echo "Usage: resolve_review_thread.sh PRRT_..." >&2
            exit 1
          fi

          gh api graphql -f query="mutation { resolveReviewThread(input: {threadId: \"${THREAD_ID}\"}) { thread { id isResolved } } }"
          echo "✅ Resolved thread ${THREAD_ID}"
          SCRIPT
          chmod +x "$STATUS_DIR/read_status.sh" "$STATUS_DIR/sync_status.sh" \
            "$STATUS_DIR/fetch_open_feedback.sh" "$STATUS_DIR/resolve_review_thread.sh"
          echo "✅ Loop status directory: $STATUS_DIR"

      - name: Fetch Open PR Feedback
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "$CLAUDE_STATUS_DIR/fetch_open_feedback.sh" \
            "${{ steps.pr-info.outputs.pr_number }}" \
            "${{ github.repository }}" \
            "$CLAUDE_STATUS_DIR/open_feedback.md"
          cat "$CLAUDE_STATUS_DIR/open_feedback.md"

      # ─────────────────────────────────────────
      # LOOP 1 — Review + Fix
      # ─────────────────────────────────────────
      - name: Claude Loop 1 — Review & Fix
        id: loop1
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: '*'
          claude_args: >-
            --model claude-sonnet-4-6
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Bash(gh api:*),Bash(*fetch_open_feedback*),Bash(*resolve_review_thread*),Edit,Write,Read,Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(cat:*),Bash(ls:*),Bash(find:*),Bash(grep:*),Bash(rm:*),Bash(echo:*),Bash(mkdir:*)"
          prompt: |
            You are a fully autonomous code reviewer and fixer. This is LOOP 1 of 3.
            PR Number: ${{ steps.pr-info.outputs.pr_number }}
            Repository: ${{ github.repository }}
            Status file (MANDATORY): ${{ runner.temp }}/claude-review/loop1_status.txt
            Open feedback file: ${{ runner.temp }}/claude-review/open_feedback.md
            Resolve thread script: ${{ runner.temp }}/claude-review/resolve_review_thread.sh

            ## STRICT RULES:
            - NEVER ask developer to fix anything — you fix everything yourself
            - NEVER delete files listed in /tmp/existing_files.txt
            - You MAY delete files listed in /tmp/new_files.txt if problematic
            - Read domain files before making any fixes
            - ALWAYS write the loop status file as the FINAL action (required for workflow control)
            - Status file must contain exactly one line: either "ISSUES_FIXED" or "ALL_CLEAR"
            - Human reviewer feedback and unresolved threads are BLOCKING — they take absolute priority

            ## STEP 0 — OPEN FEEDBACK (MANDATORY — DO THIS FIRST BEFORE ANYTHING ELSE):
            1. Read the file: ${{ runner.temp }}/claude-review/open_feedback.md
            2. Check the Summary section at the bottom: "Unresolved inline threads: N"
            3. If N > 0, this is BLOCKING — you MUST address every thread marked "⚠️ RESOLVE_THIS_THREAD_ID: PRRT_..."
               For each thread:
               a. Read the file and line it refers to
               b. Apply the requested change directly (e.g. "remove the line space" means delete that blank line)
               c. Commit and push the fix: git add . && git commit -m "fix: address review thread — [description]" && git push
               d. Resolve the thread: GH_TOKEN=$GH_TOKEN ${{ runner.temp }}/claude-review/resolve_review_thread.sh PRRT_xxxxx
            4. Also address any human conversation comments listed under "Recent human PR conversation comments"
            5. Do NOT proceed to STEP 1 until every thread is resolved or confirmed unresolvable
            6. Do NOT post "All Clear" if any thread is still unresolved

            ## STEP 1 — REVIEW:
            - Run: gh pr diff ${{ steps.pr-info.outputs.pr_number }}
            - Review all changed files for bugs, security, quality, dead code, missing tests
            - Post inline comments on every NEW problem line (do not duplicate existing open threads)
            - Post comment:
              "## 🔍 Claude Review — Loop 1/3
               Found **X issue(s)**:
               - [list each issue]
               ⚙️ Auto-fixing now..."

            ## STEP 2 — FIX (if issues found):
            - Fix ALL issues yourself
            - Dead code in new files → delete
            - Dead code in existing files → add reference or test
            - Missing tests → write proper tests using domain values
            - Bugs → fix directly
            - git add . && git commit -m "fix: claude loop 1 — [fixes]" && git push
            - Resolve all addressed review threads
            - Post comment:
              "## 🔧 Auto-Fix Applied — Loop 1/3
               Fixed: [list fixes]
               Resolved threads: [list thread IDs or 'none']
               🔄 Loop 2 will re-review..."
            - Run exactly: mkdir -p "${{ runner.temp }}/claude-review" && echo "ISSUES_FIXED" > "${{ runner.temp }}/claude-review/loop1_status.txt"

            ## IF NO ISSUES FOUND AND ZERO UNRESOLVED THREADS:
            - Post comment:
              "## ✅ All Clear after Loop 1/3 — No issues found!
               👨‍💻 Code review passed (no review fixes applied)."
            - Run exactly: mkdir -p "${{ runner.temp }}/claude-review" && echo "ALL_CLEAR" > "${{ runner.temp }}/claude-review/loop1_status.txt"

      - name: Sync Loop 1 Status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "$CLAUDE_STATUS_DIR/sync_status.sh" 1 \
            "$CLAUDE_STATUS_DIR/loop1_status.txt" \
            "${{ steps.pr-info.outputs.pr_number }}" \
            "${{ github.repository }}" \
            "ALL_CLEAR" \
            "$CLAUDE_STATUS_DIR/read_status.sh"

      - name: Check Loop 1 Status
        id: check1
        run: |
          STATUS=$(tr -d '[:space:]' < "$CLAUDE_STATUS_DIR/loop1_status.txt")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "Loop 1 status: $STATUS"

      # ─────────────────────────────────────────
      # LOOP 2 — Review + Fix (only if loop 1 had issues)
      # ─────────────────────────────────────────
      - name: Refresh Open PR Feedback
        if: steps.check1.outputs.status != 'ALL_CLEAR'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "$CLAUDE_STATUS_DIR/fetch_open_feedback.sh" \
            "${{ steps.pr-info.outputs.pr_number }}" \
            "${{ github.repository }}" \
            "$CLAUDE_STATUS_DIR/open_feedback.md"

      - name: Claude Loop 2 — Re-Review & Fix
        id: loop2
        if: steps.check1.outputs.status != 'ALL_CLEAR'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: '*'
          claude_args: >-
            --model claude-sonnet-4-6
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Bash(gh api:*),Bash(*fetch_open_feedback*),Bash(*resolve_review_thread*),Edit,Write,Read,Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(cat:*),Bash(ls:*),Bash(find:*),Bash(grep:*),Bash(rm:*),Bash(echo:*),Bash(mkdir:*)"
          prompt: |
            You are a fully autonomous code reviewer and fixer. This is LOOP 2 of 3.
            PR Number: ${{ steps.pr-info.outputs.pr_number }}
            Repository: ${{ github.repository }}
            Loop 1 already applied fixes — re-review now.
            Status file (MANDATORY): ${{ runner.temp }}/claude-review/loop2_status.txt
            Open feedback file: ${{ runner.temp }}/claude-review/open_feedback.md
            Resolve thread script: ${{ runner.temp }}/claude-review/resolve_review_thread.sh

            ## STRICT RULES:
            - NEVER ask developer to fix anything — you fix everything yourself
            - NEVER delete files listed in /tmp/existing_files.txt
            - You MAY delete files listed in /tmp/new_files.txt if problematic
            - ALWAYS write the loop status file as the FINAL action (required for workflow control)
            - Status file must contain exactly one line: either "ISSUES_FIXED" or "ALL_CLEAR"
            - Human reviewer feedback and unresolved threads are BLOCKING

            ## STEP 0 — OPEN FEEDBACK (MANDATORY — DO THIS FIRST BEFORE ANYTHING ELSE):
            1. Read the file: ${{ runner.temp }}/claude-review/open_feedback.md
            2. Check the Summary section: "Unresolved inline threads: N"
            3. If N > 0, address every thread marked "⚠️ RESOLVE_THIS_THREAD_ID: PRRT_..."
               For each thread:
               a. Read the file and line it refers to
               b. Apply the requested change directly
               c. Commit and push: git add . && git commit -m "fix: address review thread — [description]" && git push
               d. Resolve: GH_TOKEN=$GH_TOKEN ${{ runner.temp }}/claude-review/resolve_review_thread.sh PRRT_xxxxx
            4. Also address any human conversation comments
            5. Do NOT post "All Clear" if any thread is still unresolved

            ## STEP 1 — RE-REVIEW:
            - Run: gh pr diff ${{ steps.pr-info.outputs.pr_number }}
            - Review ALL changed files again carefully
            - Post inline comments on any remaining NEW problem lines
            - Post comment:
              "## 🔍 Claude Re-Review — Loop 2/3
               Found **X issue(s)** remaining:
               - [list each issue]
               ⚙️ Auto-fixing now..."

            ## STEP 2 — FIX (if issues found):
            - Fix ALL remaining issues
            - git add . && git commit -m "fix: claude loop 2 — [fixes]" && git push
            - Resolve all addressed review threads
            - Post comment:
              "## 🔧 Auto-Fix Applied — Loop 2/3
               Fixed: [list fixes]
               Resolved threads: [list thread IDs or 'none']
               🔄 Loop 3 will re-review..."
            - Run exactly: mkdir -p "${{ runner.temp }}/claude-review" && echo "ISSUES_FIXED" > "${{ runner.temp }}/claude-review/loop2_status.txt"

            ## IF NO ISSUES FOUND AND ZERO UNRESOLVED THREADS:
            - Post comment:
              "## ✅ All Clear after Loop 2/3 — All issues resolved!
               👨‍💻 PR is ready for your review and approval."
            - Run exactly: mkdir -p "${{ runner.temp }}/claude-review" && echo "ALL_CLEAR" > "${{ runner.temp }}/claude-review/loop2_status.txt"

      - name: Sync Loop 2 Status
        if: always() && steps.check1.outputs.status != 'ALL_CLEAR'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "$CLAUDE_STATUS_DIR/sync_status.sh" 2 \
            "$CLAUDE_STATUS_DIR/loop2_status.txt" \
            "${{ steps.pr-info.outputs.pr_number }}" \
            "${{ github.repository }}" \
            "ALL_CLEAR" \
            "$CLAUDE_STATUS_DIR/read_status.sh"

      - name: Check Loop 2 Status
        id: check2
        if: steps.check1.outputs.status != 'ALL_CLEAR'
        run: |
          STATUS=$(tr -d '[:space:]' < "$CLAUDE_STATUS_DIR/loop2_status.txt")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "Loop 2 status: $STATUS"

      # ─────────────────────────────────────────
      # LOOP 3 — Final Review
      # ─────────────────────────────────────────
      - name: Refresh Open PR Feedback (Loop 3)
        if: |
          steps.check1.outputs.status != 'ALL_CLEAR' &&
          steps.check2.outputs.status != 'ALL_CLEAR'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "$CLAUDE_STATUS_DIR/fetch_open_feedback.sh" \
            "${{ steps.pr-info.outputs.pr_number }}" \
            "${{ github.repository }}" \
            "$CLAUDE_STATUS_DIR/open_feedback.md"

      - name: Claude Loop 3 — Final Review
        if: |
          steps.check1.outputs.status != 'ALL_CLEAR' &&
          steps.check2.outputs.status != 'ALL_CLEAR'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: '*'
          claude_args: >-
            --model claude-sonnet-4-6
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Bash(gh api:*),Bash(*fetch_open_feedback*),Bash(*resolve_review_thread*),Edit,Write,Read,Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(cat:*),Bash(ls:*),Bash(find:*),Bash(grep:*),Bash(rm:*),Bash(echo:*),Bash(mkdir:*)"
          prompt: |
            You are a fully autonomous code reviewer and fixer. This is LOOP 3 of 3 — FINAL LOOP.
            PR Number: ${{ steps.pr-info.outputs.pr_number }}
            Repository: ${{ github.repository }}
            Loops 1 and 2 already applied fixes — do one final review and fix attempt.
            Status file (MANDATORY): ${{ runner.temp }}/claude-review/loop3_status.txt
            Open feedback file: ${{ runner.temp }}/claude-review/open_feedback.md
            Resolve thread script: ${{ runner.temp }}/claude-review/resolve_review_thread.sh

            ## STRICT RULES:
            - NEVER ask developer to fix anything — you fix everything yourself
            - NEVER delete files listed in /tmp/existing_files.txt
            - You MAY delete files listed in /tmp/new_files.txt if problematic
            - This is the LAST loop — fix everything possible
            - ALWAYS write the loop status file as the FINAL action (required for workflow control)
            - Status file must contain exactly one line: either "ALL_CLEAR" or "ISSUES_REMAIN"
            - Human reviewer feedback and unresolved threads are BLOCKING

            ## STEP 0 — OPEN FEEDBACK (MANDATORY — DO THIS FIRST BEFORE ANYTHING ELSE):
            1. Read the file: ${{ runner.temp }}/claude-review/open_feedback.md
            2. Check the Summary section: "Unresolved inline threads: N"
            3. If N > 0, address every thread marked "⚠️ RESOLVE_THIS_THREAD_ID: PRRT_..."
               For each thread:
               a. Read the file and line it refers to
               b. Apply the requested change directly
               c. Commit and push: git add . && git commit -m "fix: address review thread — [description]" && git push
               d. Resolve: GH_TOKEN=$GH_TOKEN ${{ runner.temp }}/claude-review/resolve_review_thread.sh PRRT_xxxxx
            4. Also address any human conversation comments
            5. Do NOT post "All Clear" if any thread is still unresolved

            ## STEP 1 — FINAL REVIEW:
            - Run: gh pr diff ${{ steps.pr-info.outputs.pr_number }}
            - Review ALL changed files one final time
            - Post inline comments on any remaining NEW issues

            ## STEP 2 — FINAL FIX (if issues found):
            - Fix everything possible
            - git add . && git commit -m "fix: claude loop 3 — [fixes]" && git push
            - Resolve all addressed review threads

            ## IF ZERO ISSUES AND ZERO UNRESOLVED THREADS:
            - Post this comment:
              "## ✅ Claude Review Complete — All Clear!
               All issues resolved across 3 loops.
               **All fixes applied:** [complete list]
               **Resolved threads:** [list thread IDs or 'none']
               👨‍💻 PR is ready for your review and approval."
            - Run exactly: mkdir -p "${{ runner.temp }}/claude-review" && echo "ALL_CLEAR" > "${{ runner.temp }}/claude-review/loop3_status.txt"

            ## IF ISSUES STILL REMAIN AFTER LOOP 3:
            - Post this comment:
              "## ⚠️ Claude Review — 3 Loops Completed
               **Auto-fixed:** [list everything fixed in loops 1, 2 and 3]
               **Unresolved threads:** [list thread IDs still open]
               **Still requires attention:** [list remaining issues with filename and line]
               🔍 **These issues need developer review before merging.**"
            - Run exactly: mkdir -p "${{ runner.temp }}/claude-review" && echo "ISSUES_REMAIN" > "${{ runner.temp }}/claude-review/loop3_status.txt"

      - name: Sync Loop 3 Status
        if: |
          always() &&
          steps.check1.outputs.status != 'ALL_CLEAR' &&
          steps.check2.outputs.status != 'ALL_CLEAR'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "$CLAUDE_STATUS_DIR/sync_status.sh" 3 \
            "$CLAUDE_STATUS_DIR/loop3_status.txt" \
            "${{ steps.pr-info.outputs.pr_number }}" \
            "${{ github.repository }}" \
            "ISSUES_REMAIN" \
            "$CLAUDE_STATUS_DIR/read_status.sh"

      - name: Check Loop 3 Status
        id: check3
        if: |
          steps.check1.outputs.status != 'ALL_CLEAR' &&
          steps.check2.outputs.status != 'ALL_CLEAR'
        run: |
          STATUS=$(tr -d '[:space:]' < "$CLAUDE_STATUS_DIR/loop3_status.txt")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "Loop 3 status: $STATUS"
