name: Claude PR Review & Auto Fix

on:
  pull_request:
    types: [labeled]
    branches:
      - test-claude-workflow

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  review-and-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.label.name == 'claude-review'
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "claude-bot"
          git config user.email "claude-bot@users.noreply.github.com"

      - name: Dry Run — Verify Workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🧪 DRY RUN MODE — Workflow Triggered Successfully!
              
              ✅ Label trigger working
              ✅ GitHub token working  
              ✅ Permissions working
              ✅ Checkout working
              
              🔍 **Step 1 — Review:** Would analyze PR diff and post inline comments
              🔧 **Step 2 — Fix:** Would apply fixes, commit and push
              🔄 **Step 3 — Re-Review:** Would verify fixes and approve
              
              > Dry run complete — no Claude API used`
            });
            console.log('Dry run comment posted successfully');
