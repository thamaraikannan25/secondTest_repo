name: Claude PR Review

on:
  pull_request:
    types: [opened]
    branches:
      - main

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude PR Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: "claude-sonnet-4-6"
          direct_prompt: |
            Please review this PR and provide feedback:
            - Post inline comments on specific lines with issues
            - Check for bugs, security issues, and code quality
            - Request changes if fixes are needed
            - Approve if everything looks good
